# Firebase App Hosting Configuration
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Environment variables
env:
  # Firebase Client Config (public - available at BUILD and RUNTIME)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDvJGesEgrWt7A85hg6ffYW2KE_MlPivdI
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: sample-firebase-ai-3e3e5.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: sample-firebase-ai-3e3e5
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: sample-firebase-ai-3e3e5.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "933141615367"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:933141615367:web:db20a3725b8f099093eba2
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://qnhub.aflahdev.in
    availability:
      - BUILD
      - RUNTIME

  # Firebase Admin (server-side only)
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: sample-firebase-ai-3e3e5
    availability:
      - RUNTIME
  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    value: firebase-adminsdk-fbsvc@sample-firebase-ai-3e3e5.iam.gserviceaccount.com
    availability:
      - RUNTIME

  # NextAuth
  - variable: NEXTAUTH_URL
    value: https://qnhub--sample-firebase-ai-3e3e5.firebaseapp.com
    availability:
      - RUNTIME

  # SMTP Config
  - variable: SMTP_HOST
    value: smtp.gmail.com
    availability:
      - RUNTIME
  - variable: SMTP_PORT
    value: "587"
    availability:
      - RUNTIME
  - variable: SMTP_FROM
    value: gctanur.moodl@gmail.com
    availability:
      - RUNTIME

  # Secrets - Must be set using Firebase CLI:
  # firebase apphosting:secrets:set FIREBASE_ADMIN_PRIVATE_KEY
  # firebase apphosting:secrets:set NEXTAUTH_SECRET
  # firebase apphosting:secrets:set SMTP_USER
  # firebase apphosting:secrets:set SMTP_PASS
  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: FIREBASE_ADMIN_PRIVATE_KEY
  - variable: NEXTAUTH_SECRET
    secret: NEXTAUTH_SECRET
  - variable: SMTP_USER
    secret: SMTP_USER
  - variable: SMTP_PASS
    secret: SMTP_PASS
